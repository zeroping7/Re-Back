<!doctype html><meta charset="utf-8"><title>Prueba de motores (AUD-13)</title>
<script type="module">
// Renderiza los motores (muestras y sintetizado) en un OfflineAudioContext, sin abrir el juego.
import { EngineVoice, SampleVoice, makeWaves, loadEngineBank } from '/src/audio.js';
import { CARS } from '/src/cars.js';
const SR = 44100;
// vueltas / gas / volumen igual que Sfx.update()
function gameVol(def, rpm, thr) {
  return def.motor === 'Nitro' ? 0.06 + thr * 0.05 + rpm * 0.05 : (0.015 + thr * 0.06 + rpm * 0.07) * Math.min(1, rpm * 6 + thr);
}
const prof = (t) => { // arrancar, acelerar, soltar, volver a acelerar
  if (t < 1) return [0, 0];
  if (t < 5) return [(t - 1) / 4, 1];
  if (t < 6.5) return [1, 1];
  if (t < 9.5) return [1 - 0.65 * (t - 6.5) / 3, 0];
  return [Math.min(0.9, 0.35 + (t - 9.5) * 0.3), 1];
};
window.renderCar = async (id, kind, secs = 12.5) => {
  const def = CARS.find((c) => c.id === id);
  const ctx = new OfflineAudioContext(1, SR * secs, SR);
  const master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
  let voice;
  if (kind === 'old') {
    const nb = ctx.createBuffer(1, SR * 1.5, SR), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    voice = new EngineVoice(ctx, master, makeWaves(ctx), nb);
  } else voice = new SampleVoice(ctx, master, await loadEngineBank(ctx));
  voice.setCar(def);
  let rpm = 0;
  for (let t = 0; t < secs - 0.1; t += 0.05) {
    const tq = Math.round(t * SR / 128) * 128 / SR;
    ctx.suspend(Math.max(tq, 128 / SR)).then(() => {
      let [target, thr] = prof(tq);
      if (def.motor === 'Nitro') target = Math.max(target, 0.04);
      const rate = target > rpm ? (def.motor === 'Nitro' ? 5 : 8) : (def.motor === 'Nitro' ? 2.6 : 4);
      rpm += (target - rpm) * Math.min(1, rate * 0.05);
      voice.set(rpm, thr, gameVol(def, rpm, thr));
      ctx.resume();
    });
  }
  const buf = await ctx.startRendering();
  const x = buf.getChannelData(0), i16 = new Int16Array(x.length);
  for (let i = 0; i < x.length; i++) i16[i] = Math.max(-1, Math.min(1, x[i])) * 32767;
  let bin = ''; const u8 = new Uint8Array(i16.buffer);
  for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode(...u8.subarray(i, i + 8192));
  return btoa(bin);
};
window.ready = true;
</script>

name: Build (web + APK)

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar APK y publicar web
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Comprobar Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk re-back.apk
      - name: Subir web + APK a la rama gh-pages
        run: cp re-back.apk dist/re-back.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/upload-artifact@v4
        with:
          name: re-back-apk
          path: re-back.apk
      - name: Publicar release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Re-Back v1.0.${{ github.run_number }}
          body: |
            APK automático del commit ${{ github.sha }}.
            Descarga directa de la última versión:
            https://github.com/${{ github.repository }}/releases/latest/download/re-back.apk
          files: re-back.apk
          make_latest: true
